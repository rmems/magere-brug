[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["rmems <raulmc@proton.me>"]
license = "Apache-2.0 OR MIT"
repository = "https://github.com/rmems/magere-brug"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
miette = "7.6.0"
camino = "1.2.2"
clap = { version = "4.6.1", features = ["derive"] }
jsonschema = "0.46.5"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.8.1"
sha2 = "0.10.8"
