[package]
name = "magere-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "magere"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
jsonschema = "0.46.5"
clap = { version = "4.6.1", features = ["derive"] }
sha2 = "0.10.8"
camino = "1.2.2"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
miette = "7.6.0"
chrono = { version = "0.4", features = ["serde"] }
magere-corinth-core = { path = "../magere-corinth-core" }

[dev-dependencies]
tempfile = "3.8.1"
