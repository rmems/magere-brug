[project]
name = "magere-brug-scripts"
version = "0.1.0"
description = "Python helper scripts for magere-brug model quantization manifest lab"
requires-python = ">=3.10"

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
